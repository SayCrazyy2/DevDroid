[project]
name = "devdroid"
version = "2.2.4"
description = "DevDroid — Full Chrome DevTools on Android via ADB/Shizuku (Shizuku + modern UI)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["aiohttp>=3.9,<4", "websockets>=12,<15"]
authors = [{ name = "SayCrazyy2" }, { name = "lyc8503" }]

[project.scripts]
devdroid = "devtools:main"
android-chrome-devtools = "devtools:main"

[project.urls]
Homepage = "https://github.com/SayCrazyy2/DevDroid"
Issues = "https://github.com/SayCrazyy2/DevDroid/issues"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E","F","W"]
